apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-flags-app
  labels:
    app: team-flags-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: team-flags-app
  template:
    metadata:
      labels:
        app: team-flags-app
    spec:
      containers:
      - name: team-flags-app
        image: team-flags-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
#        env:
#       - name: MONGO_URL
#         value: "mongodb://mongo:27017/myapp"